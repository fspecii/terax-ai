<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dictation</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #pill {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        height: 40px;
        margin: 6px;
        border-radius: 999px;
        background: rgba(18, 18, 24, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
        color: rgba(255, 255, 255, 0.92);
        font:
          500 12.5px/1 -apple-system,
          system-ui,
          sans-serif;
        cursor: pointer;
      }
      #dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: #f43f5e;
        animation: pulse 1.1s ease-in-out infinite;
      }
      #pill[data-state="transcribing"] #dot {
        background: #fbbf24;
        animation-duration: 0.55s;
      }
      #pill[data-state="speaking"] #dot {
        background: #38bdf8;
        animation-duration: 1.6s;
      }
      #bars {
        display: none;
        align-items: center;
        gap: 2.5px;
        height: 16px;
      }
      #bars i {
        width: 3px;
        height: 3px;
        border-radius: 2px;
        background: #f43f5e;
        transition: height 90ms ease;
      }
      #pill[data-state="recording"] #bars {
        display: flex;
      }
      #pill[data-state="recording"] #dot {
        display: none;
      }
      #targets {
        display: none;
        flex-direction: column;
        gap: 3px;
        margin: 0 6px 6px;
        max-height: 224px;
        overflow-y: auto;
        scrollbar-width: none;
      }
      #targets::-webkit-scrollbar {
        display: none;
      }
      #targets.visible {
        display: flex;
      }
      .target {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 6px 10px;
        border-radius: 10px;
        background: rgba(18, 18, 24, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.72);
        font:
          500 11.5px/1 -apple-system,
          system-ui,
          sans-serif;
        cursor: pointer;
      }
      .target.current {
        border-color: rgba(56, 189, 248, 0.75);
        background: rgba(30, 34, 46, 0.95);
        color: #fff;
      }
      .target .idx {
        opacity: 0.5;
        font-size: 10px;
        min-width: 9px;
      }
      .target .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .target .agent-dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: #4ade80;
        margin-left: auto;
        flex-shrink: 0;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.45;
          transform: scale(0.78);
        }
      }
    </style>
  </head>
  <body>
    <div id="pill" data-state="recording" title="Click to stop">
      <span id="dot"></span>
      <span id="bars"><i></i><i></i><i></i><i></i><i></i></span>
      <span id="label">Recording...</span>
    </div>
    <div id="targets"></div>
    <script type="module" src="/src/overlay/main.ts"></script>
  </body>
</html>
